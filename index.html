/* ============================================================ TOKENS ==== */
:root{
  color-scheme: light;
  --bg:#dee1d8; --surface:#f7f5ee; --surface-2:#efece1; --surface-3:#e6e2d4;
  --border:#dcd7c7; --border-soft:#e6e1d3;
  --text:#2c332f; --text-dim:#5a635d; --text-faint:#7a8178;
  --accent:#26505c; --accent-2:#2f6b73;
  --mint:#a8d5bf; --mint-deep:#4e9d78; --mint-ring:#8ecdb0;
  --btn:#ccd7d0; --btn-hover:#c3d1c9;
  --amber:#e8c98a; --amber-ink:#6b4f16;
  --r-lg:28px; --r-md:20px; --r-sm:12px; --r-xs:8px; --r-pill:100px;
  --lift:0 1px 2px rgba(44,51,47,.05), 0 18px 40px -24px rgba(44,51,47,.30);
  --lift-sm:0 1px 2px rgba(44,51,47,.05), 0 8px 18px -12px rgba(44,51,47,.26);
  --inset-hi:inset 0 1px 0 rgba(255,255,255,.75);
  --press:inset 0 2px 5px rgba(44,51,47,.13), inset 0 -1px 0 rgba(255,255,255,.6);
  --font-ui:"SF Compact",-apple-system,BlinkMacSystemFont,"Segoe UI",
            "Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1c2422; --surface:#232d2b; --surface-2:#2a3532; --surface-3:#313d39;
  --border:#384340; --border-soft:#313c39;
  --text:#eceadf; --text-dim:#a2aca6; --text-faint:#77827c;
  --accent:#7fb3c4; --accent-2:#8cc0d0;
  --mint:#2f5f4b; --mint-deep:#5fd39f; --mint-ring:#3ddc84;
  --btn:#33433f; --btn-hover:#3c4d48;
  --amber:#6b5a2e; --amber-ink:#f0dca8;
  --lift:0 1px 2px rgba(0,0,0,.34), 0 18px 40px -24px rgba(0,0,0,.7);
  --lift-sm:0 1px 2px rgba(0,0,0,.34), 0 8px 18px -12px rgba(0,0,0,.6);
  --inset-hi:inset 0 1px 0 rgba(255,255,255,.06);
  --press:inset 0 2px 5px rgba(0,0,0,.4), inset 0 -1px 0 rgba(255,255,255,.05);
}

/* ============================================================= BASE ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:15.5px; line-height:1.55;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding:26px 22px 34px;
}
.app{max-width:1760px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
h1,h2,h3{margin:0}
button,input{font:inherit; color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:100px; border:3px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint); background-clip:content-box}

/* ============================================================ TOPBAR ==== */
.topbar{
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--lift), var(--inset-hi);
  padding:24px 30px 22px;
}
.eyebrow{margin:0 0 7px; font-size:12px; font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:var(--accent)}
h1{font-size:clamp(34px,5vw,54px); font-weight:800; letter-spacing:-.03em; line-height:1}
.lede{margin:10px 0 0; color:var(--text-dim); font-size:15px}
.lede b{color:var(--text); font-weight:700}
.top-actions{display:flex; gap:10px; align-items:center}

.btn{
  border:1px solid var(--border); background:var(--btn); color:var(--text);
  border-radius:var(--r-pill); padding:11px 22px; cursor:pointer;
  font-size:14px; font-weight:700; letter-spacing:.02em;
  box-shadow:var(--lift-sm), var(--inset-hi);
  transition:background .14s ease, transform .14s ease, box-shadow .14s ease;
}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:translateY(1px); box-shadow:var(--press)}
.btn:focus-visible{outline:3px solid var(--mint-ring); outline-offset:2px}
.btn.amber{background:var(--amber); color:var(--amber-ink); border-color:transparent}
.btn.icon{padding:9px 13px}

/* ============================================================ LAYOUT ==== */
.layout{display:grid; grid-template-columns:335px minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:1080px){
  .layout, body.rail-collapsed .layout{grid-template-columns:1fr}
  .rail-shell{position:static !important}
}

/* ---- rail shell -------------------------------------------------------
   The rail scrolls, so it clips; the shell is the sticky, unclipped
   element the edge handle can hang off. */
.rail-shell{position:sticky; top:16px; align-self:start}
.rail-toggle{
  position:absolute; top:30px; right:-14px; z-index:30;
  width:28px; height:28px; padding:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--accent) 12%, var(--surface));
  color:var(--accent); border:1px solid var(--accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 3px 8px -2px rgba(44,51,47,.4);
  font-size:16px; line-height:1; font-weight:700; cursor:pointer;
  transition:background .15s ease, color .15s ease, transform .15s ease;
}
.rail-toggle:hover{background:var(--accent); color:var(--surface); transform:translateY(-1px)}
.rail-toggle:active{transform:translateY(1px)}
.rail-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- folded: a chip carrying just the tile ---------------------------- */
body.rail-collapsed .layout{grid-template-columns:76px minmax(0,1fr)}
body.rail-collapsed .rail{padding:12px 8px; overflow:hidden; height:auto; max-height:none}
body.rail-collapsed .rail > *:not(.rail-logo){display:none}
body.rail-collapsed .rail-logo{width:42px; height:42px; border-radius:12px; margin:0 auto}

/* ============================================================== RAIL ==== */
.rail{
  position:relative;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--lift), var(--inset-hi);
  padding:18px 16px 16px;
  max-height:calc(100vh - 32px); overflow:auto;
  display:flex; flex-direction:column; gap:14px;
}
.rail-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:0 4px 12px; border-bottom:1px solid var(--border-soft);
}
.rail-head span{font-size:15px; font-weight:800; letter-spacing:.34em; text-transform:uppercase}
.fgroup{display:flex; flex-direction:column; gap:9px}
.fgroup > h3{
  display:flex; align-items:center; gap:8px;
  font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); padding:0 4px;
}
.fgroup > h3 .n{
  margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.04em;
  color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border-soft);
  border-radius:var(--r-pill); padding:1px 8px;
}
.fgroup > h3 .clr{
  border:0; background:transparent; color:var(--text-faint); cursor:pointer;
  font-size:13px; line-height:1; padding:2px 4px; border-radius:6px;
}
.fgroup > h3 .clr:hover{color:var(--text); background:var(--surface-2)}

/* pill inputs — the pressed/inset input of the styleguide */
.search{position:relative; display:flex; align-items:center}
.search input{
  width:100%; border:1px solid var(--border); background:var(--surface-2);
  border-radius:var(--r-pill); padding:11px 36px 11px 16px; font-size:14.5px;
  box-shadow:var(--press); outline:none;
}
.search input::placeholder{color:var(--text-faint)}
.search input:focus{border-color:var(--mint-ring); box-shadow:var(--press), 0 0 0 3px color-mix(in srgb, var(--mint-ring) 40%, transparent)}
.search .mag{position:absolute; right:14px; color:var(--text-faint); font-size:14px; pointer-events:none}

/* chip cloud */
.chips{display:flex; flex-wrap:wrap; gap:7px; max-height:215px; overflow:auto; padding:2px 2px 4px}
.chip{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
  border-radius:var(--r-pill); padding:6px 14px; cursor:pointer;
  font-size:13px; font-weight:700; white-space:nowrap;
  box-shadow:var(--inset-hi);
  transition:background .13s ease, color .13s ease, border-color .13s ease;
}
.chip:hover{background:var(--surface-3); color:var(--text)}
.chip.is-on{background:var(--mint); border-color:transparent; color:#14322a; box-shadow:var(--lift-sm), var(--inset-hi)}
:root[data-theme="dark"] .chip.is-on{color:#dff5ea}
.chip:focus-visible{outline:3px solid var(--mint-ring); outline-offset:2px}
.chip .c{opacity:.62; font-weight:600; margin-left:6px; font-size:11.5px}

/* column checklist */
.collist{
  max-height:380px; overflow:auto; border:1px solid var(--border-soft);
  border-radius:var(--r-sm); background:var(--surface-2); box-shadow:var(--press);
  padding:6px;
}
.colrow{display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:var(--r-xs); cursor:pointer}
.colrow:hover{background:var(--surface-3)}
.colrow input{accent-color:var(--mint-deep); width:15px; height:15px; margin:0; cursor:pointer}
.colrow .nm{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.colrow .ct{margin-left:auto; font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums}
.mini-actions{display:flex; gap:6px}
.mini{
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
  border-radius:var(--r-pill); padding:5px 13px; font-size:12px; font-weight:700; cursor:pointer;
}
.mini:hover{background:var(--surface-3); color:var(--text)}

/* ============================================================= MAIN ===== */
main{display:flex; flex-direction:column; gap:18px; min-width:0}
.panel{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--lift), var(--inset-hi);
  padding:20px 22px 22px;
}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px}
h2{font-size:12.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);
   display:flex; align-items:baseline; gap:10px}
h2 .n{font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.02em; text-transform:none}

/* KPI tiles */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:14px}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  box-shadow:var(--lift-sm), var(--inset-hi); padding:15px 18px 14px;
  display:flex; flex-direction:column; gap:2px;
}
.kpi b{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
.kpi span{font-size:11px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--text-dim)}
.kpi em{font-style:normal; font-size:12.5px; color:var(--text-faint)}

/* ============================================================ TABLES ==== */
.tbl-scroll{
  border:1px solid var(--border-soft); border-radius:var(--r-md);
  background:var(--surface-2); box-shadow:var(--press);
  overflow:auto; max-height:min(76vh,960px); min-height:280px; position:relative;
}

.tbl{width:max-content; min-width:100%}
.thead{
  position:sticky; top:0; z-index:5; display:grid;
  background:var(--accent); border-radius:0;
}
.thead .th{
  padding:12px 13px; font-size:11.5px; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:#f2f6f4; cursor:pointer; user-select:none;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-right:1px solid rgba(255,255,255,.12);
}
:root[data-theme="dark"] .thead{background:#2c3c42}
:root[data-theme="dark"] .thead .th{color:#e6efe9}
.thead .th:hover{background:rgba(255,255,255,.10)}
.thead .th .arw{opacity:.55; margin-left:5px; font-size:9px}
.tbody{position:relative}
.vrows{position:absolute; top:0; left:0; right:0}
.tr{display:grid; border-bottom:1px solid var(--border-soft)}
.tr:nth-child(even){background:color-mix(in srgb, var(--surface) 55%, transparent)}
.tr:hover{background:color-mix(in srgb, var(--mint) 26%, transparent)}
.td{
  padding:0 13px; height:39px; line-height:39px; font-size:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-right:1px solid var(--border-soft);
}
.td.num{text-align:right; font-variant-numeric:tabular-nums}
.td.k{font-weight:700}
.td.blank{color:var(--text-faint); font-style:italic}
.tfoot{
  display:grid; border-top:2px solid var(--border);
  background:var(--surface-3); font-weight:800;
}
.tfoot .td{border-right:1px solid var(--border-soft)}
.td.fill, .th.fill{border-right:0}
.td.fill{display:flex; align-items:center; padding-right:16px}

.empty{
  padding:48px 20px; text-align:center; color:var(--text-dim); font-size:15px;
}

/* ============================================================= BOOT ===== */
#boot{
  position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:var(--bg); flex-direction:column; gap:16px;
}
#boot .ring{
  width:44px; height:44px; border-radius:50%;
  border:4px solid var(--border); border-top-color:var(--mint-deep);
  animation:spin .85s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#boot p{margin:0; color:var(--text-dim); font-size:15px}
.hide{display:none !important}
.note{font-size:13px; color:var(--text-faint); margin:10px 2px 0}
</style>
</head>

  <div class="ring"></div>

      </section>

      <section class="fgroup">
        <h3>Type <span class="n" id="nType"></span><button class="clr" data-clear="type" title="ล้าง">✕</button></h3>
        <label class="search"><input id="qType" placeholder="กรอง TYPE…" autocomplete="off"><i class="mag">⌕</i></label>
        <div class="chips" id="cType"></div>
      </section>

      <section class="fgroup">
        <h3>CP name <span class="n" id="nCp"></span><button class="clr" data-clear="cp" title="ล้าง">✕</button></h3>
        <label class="search"><input id="qCp" placeholder="กรอง CP…" autocomplete="off"><i class="mag">⌕</i></label>
        <div class="chips" id="cCp"></div>
      </section>

      <section class="fgroup" id="gCols">
        <h3>Custom column <span class="n" id="nCols"></span></h3>
        <label class="search"><input id="qCol" placeholder="ค้นหาคอลัมน์…" autocomplete="off"><i class="mag">⌕</i></label>
        <div class="mini-actions">
          <button class="mini" id="colReset">คอลัมน์เริ่มต้น</button>
          <button class="mini" id="colNone">ล้างทั้งหมด</button>
        </div>
        <div class="collist" id="colList"></div>
      </section>
      </aside>
    </div>

    <main>
      <div class="kpis" id="kpis"></div>

      <section class="panel">
        <div class="panel-head">
          <h2>Tag records <span class="n" id="rowNote"></span></h2>
          <span class="note" id="colNote"></span>
        </div>
        <div class="tbl-scroll" id="tblScroll">
          <div class="tbl">
            <div class="thead" id="thead"></div>
            <div class="tbody" id="tbody"><div class="vrows" id="vrows"></div></div>
          </div>
        </div>
        <div class="empty hide" id="tblEmpty">ไม่พบข้อมูลที่ตรงกับตัวกรอง</div>
      </section>
    </main>
  </div>
</div>

<script src="data.js"></script>
<script>
"use strict";

/* =======================================================================
   1. DECODE  —  base64 -> gzip -> JSON  (works straight off file://)
   ======================================================================= */
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('en-US');

async function decodePayload(b64){
  const bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
  for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(buf));
}

/* =======================================================================
   2. COLUMN STORE
   Each column is a dictionary + codes. Dense columns carry no row ids;
   sparse ones carry delta-encoded row ids. Dense code arrays are built
   only for the columns actually touched, so picking 8 of 1,202 columns
   costs 8 x 308 KB rather than 370 MB.
   ======================================================================= */
let N = 0, HEAD = [], RAW = [], IDX = new Map();
const denseCache = new Map();
const EMPTY_D = [];

function spec(ci){ const s = RAW[ci]; return (s && s.d) ? s : null; }
function dictOf(ci){ const s = spec(ci); return s ? s.d : EMPTY_D; }
function fillOf(ci){ const s = spec(ci); return s ? s.v.length : 0; }

function dense(ci){
  let a = denseCache.get(ci);
  if (a) return a;
  a = new Int32Array(N).fill(-1);
  const s = spec(ci);
  if (s){
    const v = s.v;
    if (s.r){ let row = 0, r = s.r;
      for (let k = 0; k < v.length; k++){ row += r[k]; a[row] = v[k]; }
    } else {
      for (let k = 0; k < v.length; k++) a[k] = v[k];
    }
  }
  if (denseCache.size > 140) denseCache.clear();   // cheap ceiling on memory
  denseCache.set(ci, a);
  return a;
}
function valueAt(ci, row){
  const c = dense(ci)[row];
  return c < 0 ? '' : RAW[ci].d[c];
}

/* distinct values of a column, with row counts, sorted by label */
function distinct(ci){
  const d = dictOf(ci), cnt = new Int32Array(d.length + 1), a = dense(ci);
  for (let i = 0; i < N; i++) cnt[a[i] + 1]++;
  const out = [];
  if (cnt[0]) out.push({ code:-1, label:'(Blank)', n:cnt[0] });
  for (let k = 0; k < d.length; k++) if (cnt[k + 1]) out.push({ code:k, label:d[k], n:cnt[k + 1] });
  out.sort((x, y) => x.code === -1 ? -1 : y.code === -1 ? 1 : x.label.localeCompare(y.label));
  return out;
}

/* =======================================================================
   3. STATE
   ======================================================================= */
const CORE = ['AREA','CP NAME','TYPE','NAME','DESCRP','IOMOPT','IOM_ID','PNT_NO','LSCO1','HSCO1'];
let iArea, iCp, iType, iName, iDesc;

const state = {
  sets:{ area:new Set(), cp:new Set(), type:new Set() },   // holds codes (-1 = blank)
  q:{ name:'', desc:'' },
  cols:[],                       // column indices for the CUSTOM TABLE page
  sort:{ ci:null, dir:1 },
};
let sel = new Int32Array(0);     // current matching row ids

const WIDTH = { 'AREA':125, 'CP NAME':125, 'TYPE':110, 'NAME':290, 'DESCRP':340, 'Source.Name':145 };
const widthOf = ci => WIDTH[HEAD[ci]] || 155;

/* =======================================================================
   4. FILTERING
   ======================================================================= */
function setMask(ci, chosen){
  if (!chosen.size) return null;
  const m = new Uint8Array(dictOf(ci).length + 1);
  chosen.forEach(c => { m[c + 1] = 1; });
  return m;
}
function textMask(ci, q){
  if (!q) return null;
  const d = dictOf(ci), m = new Uint8Array(d.length + 1), needle = q.toLowerCase();
  for (let k = 0; k < d.length; k++) if (d[k].toLowerCase().indexOf(needle) !== -1) m[k + 1] = 1;
  return m;                                     // blank never matches a query
}

function recompute(){
  const mA = setMask(iArea, state.sets.area),
        mC = setMask(iCp,   state.sets.cp),
        mT = setMask(iType, state.sets.type),
        mN = textMask(iName, state.q.name),
        mD = textMask(iDesc, state.q.desc);
  const dA = dense(iArea), dC = dense(iCp), dT = dense(iType),
        dN = dense(iName), dD = dense(iDesc);
  const out = new Int32Array(N);
  let m = 0;
  for (let i = 0; i < N; i++){
    if (mA && !mA[dA[i] + 1]) continue;
    if (mC && !mC[dC[i] + 1]) continue;
    if (mT && !mT[dT[i] + 1]) continue;
    if (mN && !mN[dN[i] + 1]) continue;
    if (mD && !mD[dD[i] + 1]) continue;
    out[m++] = i;
  }
  sel = out.subarray(0, m);
  if (state.sort.ci !== null) applySort();
}

/* One collator, built once and reused. `a.localeCompare(b, undefined, opts)`
   builds a fresh collator on every call: ranking DESCRP's 33,387 distinct
   values that way cost 3.3 s, against 136 ms through a shared collator. */
const COLL = new Intl.Collator(undefined, { numeric:true, sensitivity:'base' });
const rankCache = new Map();

/* Rank a column's dictionary, not its rows: string compares then run over the
   distinct values (33k for DESCRP) instead of all 77,010 rows. A dictionary
   never changes once loaded, so the ranking is cached — without that it was
   recomputed inside every recompute(), i.e. on each keystroke in the search
   box while a sort was active. */
function rankOf(ci){
  let rank = rankCache.get(ci);
  if (rank) return rank;
  const d = dictOf(ci);
  const numeric = d.length > 0 && d.every(v => v !== '' && !isNaN(Number(v)));
  const order = Array.from(d.keys());
  order.sort(numeric ? (x, y) => Number(d[x]) - Number(d[y])
                     : (x, y) => COLL.compare(d[x], d[y]));
  rank = new Int32Array(d.length);
  order.forEach((c, r) => { rank[c] = r + 1; });
  rankCache.set(ci, rank);
  return rank;
}

function applySort(){
  const dir = state.sort.dir, a = dense(state.sort.ci), rank = rankOf(state.sort.ci);
  sel = sel.slice().sort((p, q) => {
    const rp = a[p] < 0 ? 0 : rank[a[p]], rq = a[q] < 0 ? 0 : rank[a[q]];
    return rp === rq ? p - q : (rp - rq) * dir;   // stable on ties, by row id
  });
}

/* =======================================================================
   5. RAIL
   ======================================================================= */
const CHIP_SRC = {};
function buildChips(key, host, ci, filterInput){
  CHIP_SRC[key] = { ci, items:distinct(ci), host, filterInput };
  paintChips(key);
  if (filterInput) filterInput.addEventListener('input', () => paintChips(key));
}
function paintChips(key){
  const src = CHIP_SRC[key], chosen = state.sets[key];
  const q = src.filterInput ? src.filterInput.value.trim().toLowerCase() : '';
  const items = q ? src.items.filter(it => it.label.toLowerCase().indexOf(q) !== -1) : src.items;
  src.host.innerHTML = items.map(it =>
    `<button class="chip${chosen.has(it.code) ? ' is-on' : ''}" data-code="${it.code}">` +
    `${esc(it.label)}<span class="c">${fmt(it.n)}</span></button>`).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

['area','type','cp'].forEach(key => {
  document.addEventListener('click', e => {
    const host = CHIP_SRC[key] && CHIP_SRC[key].host;
    if (!host) return;
    const chip = e.target.closest('.chip');
    if (!chip || !host.contains(chip)) return;
    const code = Number(chip.dataset.code);
    const s = state.sets[key];
    s.has(code) ? s.delete(code) : s.add(code);
    paintChips(key);
    refresh();
  });
});

document.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
  state.sets[b.dataset.clear].clear();
  paintChips(b.dataset.clear);
  refresh();
}));

function debounce(fn, ms){ let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
$('#qName').addEventListener('input', debounce(() => { state.q.name = $('#qName').value.trim(); refresh(); }, 180));
$('#qDesc').addEventListener('input', debounce(() => { state.q.desc = $('#qDesc').value.trim(); refresh(); }, 180));

function clearAll(){
  Object.values(state.sets).forEach(s => s.clear());
  state.q.name = state.q.desc = '';
  state.sort.ci = null;
  $('#qName').value = $('#qDesc').value = '';
  ['area','type','cp'].forEach(paintChips);
  refresh();
}
$('#clearBtn').addEventListener('click', clearAll);
$('#railReset').addEventListener('click', clearAll);

/* ---- column picker (CUSTOM TABLE) ---- */
let colCandidates = [];
function buildColPicker(){
  colCandidates = HEAD.map((h, i) => ({ i, h, n:fillOf(i) })).filter(c => c.n > 0);
  $('#qCol').addEventListener('input', paintColList);
  $('#colReset').addEventListener('click', () => { state.cols = defaultCols(); paintColList(); refresh(); });
  $('#colNone').addEventListener('click', () => { state.cols = [iArea, iCp, iType, iName]; paintColList(); refresh(); });
  $('#colList').addEventListener('change', e => {
    const cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
    const ci = Number(cb.value);
    if (cb.checked){ if (!state.cols.includes(ci)) state.cols.push(ci); }
    else state.cols = state.cols.filter(c => c !== ci);
    $('#nCols').textContent = state.cols.length;
    refresh();
  });
  paintColList();
}
function paintColList(){
  const q = $('#qCol').value.trim().toLowerCase();
  const list = (q ? colCandidates.filter(c => c.h.toLowerCase().indexOf(q) !== -1) : colCandidates).slice(0, 400);
  const on = new Set(state.cols);
  $('#colList').innerHTML = list.map(c =>
    `<label class="colrow"><input type="checkbox" value="${c.i}"${on.has(c.i) ? ' checked' : ''}>` +
    `<span class="nm">${esc(c.h)}</span><span class="ct">${fmt(c.n)}</span></label>`).join('');
  $('#nCols').textContent = state.cols.length;
}
function defaultCols(){ return CORE.map(h => IDX.get(h)).filter(v => v !== undefined); }

/* =======================================================================
   6. VIRTUAL TABLE
   ======================================================================= */
const ROWH = 39, OVER = 8;
const scroll = $('#tblScroll'), thead = $('#thead'), tbody = $('#tbody'), vrows = $('#vrows');
let visCols = [], tmpl = '';

function currentCols(){
  return state.cols.slice();
}
function renderTable(){
  visCols = currentCols();
  if (!visCols.length) visCols = [iArea, iCp, iType, iName];
  /* a trailing minmax(0,1fr) filler soaks up whatever width the fixed
     columns leave, so the header bar never ends mid-panel */
  tmpl = visCols.map(ci => widthOf(ci) + 'px').join(' ') + ' minmax(0,1fr)';
  thead.style.gridTemplateColumns = tmpl;
  thead.innerHTML = visCols.map(ci => {
    const on = state.sort.ci === ci;
    return `<div class="th" data-ci="${ci}" title="${esc(HEAD[ci])}">${esc(HEAD[ci])}` +
           `<span class="arw">${on ? (state.sort.dir > 0 ? '▲' : '▼') : '⇅'}</span></div>`;
  }).join('') + '<div class="th fill"></div>';
  tbody.style.height = Math.max(sel.length * ROWH, 1) + 'px';
  $('#tblEmpty').classList.toggle('hide', sel.length > 0);
  scroll.classList.toggle('hide', sel.length === 0);
  paintRows();
}
const NUMISH = new Set(['IOM_ID','PNT_NO','LSCO1','HSCO1','PERIOD','PHASE','IOMOPT']);
function paintRows(){
  const top = scroll.scrollTop, h = scroll.clientHeight;
  const i0 = Math.max(0, Math.floor(top / ROWH) - OVER);
  const i1 = Math.min(sel.length, Math.ceil((top + h) / ROWH) + OVER);
  vrows.style.transform = `translateY(${i0 * ROWH}px)`;
  const arrs = visCols.map(ci => dense(ci)), dicts = visCols.map(ci => dictOf(ci));
  const cls = visCols.map(ci => (NUMISH.has(HEAD[ci]) ? ' num' : '') + (ci === iName ? ' k' : ''));
  let html = '';
  for (let i = i0; i < i1; i++){
    const row = sel[i];
    html += `<div class="tr" style="grid-template-columns:${tmpl}">`;
    for (let c = 0; c < visCols.length; c++){
      const code = arrs[c][row];
      html += code < 0
        ? `<div class="td blank${cls[c]}">—</div>`
        : `<div class="td${cls[c]}" title="${esc(dicts[c][code])}">${esc(dicts[c][code])}</div>`;
    }
    html += '<div class="td fill"></div></div>';
  }
  vrows.innerHTML = html;
}
scroll.addEventListener('scroll', () => requestAnimationFrame(paintRows), { passive:true });
thead.addEventListener('click', e => {
  const th = e.target.closest('.th'); if (!th) return;
  const ci = Number(th.dataset.ci);
  if (state.sort.ci === ci) state.sort.dir = -state.sort.dir;
  else { state.sort.ci = ci; state.sort.dir = 1; }
  applySort();
  scroll.scrollTop = 0;
  renderTable();
});

/* =======================================================================
   7. AGGREGATES
   ======================================================================= */
function countBy(ci){
  const a = dense(ci), d = dictOf(ci), cnt = new Int32Array(d.length + 1);
  for (let i = 0; i < sel.length; i++) cnt[a[sel[i]] + 1]++;
  const out = [];
  if (cnt[0]) out.push({ code:-1, label:'(Blank)', n:cnt[0] });
  for (let k = 0; k < d.length; k++) if (cnt[k + 1]) out.push({ code:k, label:d[k], n:cnt[k + 1] });
  out.sort((x, y) => y.n - x.n);
  return out;
}

/* =======================================================================
   8. REFRESH
   ======================================================================= */
function uniqCount(ci){
  const a = dense(ci), seen = new Uint8Array(dictOf(ci).length + 1);
  let u = 0;
  for (let i = 0; i < sel.length; i++){ const c = a[sel[i]] + 1; if (!seen[c]){ seen[c] = 1; u++; } }
  return u;
}
function refresh(){
  recompute();
  const areaRows = countBy(iArea);

  $('#kpis').innerHTML = [
    ['Rows', fmt(sel.length), sel.length === N ? 'ทั้งหมด' : `จาก ${fmt(N)}`],
    ['CP', fmt(uniqCount(iCp)), 'control processors'],
    ['Block types', fmt(uniqCount(iType)), 'types'],
    ['Areas', fmt(areaRows.filter(r => r.code >= 0).length), 'พื้นที่'],
  ].map(([k, v, sub]) => `<div class="kpi"><span>${k}</span><b>${v}</b><em>${sub}</em></div>`).join('');

  renderTable();

  $('#rowNote').textContent = `${fmt(sel.length)} rows`;
  $('#colNote').textContent =
    `${visCols.length} คอลัมน์ · เพิ่ม/เอาออกได้ที่ CUSTOM COLUMN ทางซ้าย`;
  ['area','type','cp'].forEach(k => {
    const el = { area:'#nArea', type:'#nType', cp:'#nCp' }[k];
    $(el).textContent = state.sets[k].size ? `${state.sets[k].size} selected` : 'all';
  });
}

/* =======================================================================
   9. THEME / CSV
   ======================================================================= */
/* The fold gesture is deliberately the one the user's PT2 Online Monitor
   uses: same edge chevron, same tile-as-the-way-back-out. Two apps the same
   person uses should not fold a panel two different ways. */
const RAIL_KEY = 'fox-rail-collapsed';
const railToggle = $('#railToggle'), railLogo = $('#railLogo');

function setRailCollapsed(on, remember){
  document.body.classList.toggle('rail-collapsed', on);
  railToggle.innerHTML = on ? '&#8250;' : '&#8249;';          // the glyph IS the label
  const label = on ? 'เปิดแถบ filter' : 'ย่อแถบ filter';
  railToggle.setAttribute('aria-label', label);
  railToggle.setAttribute('aria-expanded', String(!on));
  railToggle.title = label;
  if (remember){ try { localStorage.setItem(RAIL_KEY, on ? '1' : '0'); } catch (e) {} }
  if (N) paintRows();                       // the table just changed width
}
railToggle.addEventListener('click', () =>
  setRailCollapsed(!document.body.classList.contains('rail-collapsed'), true));

/* Folded, the tile reopens the rail; open, it pauses its own float — the
   second job is what tells a reader the first one is clickable at all. */
railLogo.addEventListener('click', () => {
  if (document.body.classList.contains('rail-collapsed')){ setRailCollapsed(false, true); return; }
  const paused = railLogo.classList.toggle('paused');
  railLogo.title = paused ? 'คลิกเพื่อให้ไอคอนขยับต่อ' : 'คลิกเพื่อหยุดการเคลื่อนไหว';
  railLogo.setAttribute('aria-label', railLogo.title);
});
railLogo.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); railLogo.click(); }
});
try { if (localStorage.getItem(RAIL_KEY) === '1') setRailCollapsed(true, false); } catch (e) {}

$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  try { localStorage.setItem('fox-theme', cur); } catch (e) {}
});
try {
  const t = localStorage.getItem('fox-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch (e) {}

$('#csvBtn').addEventListener('click', () => {
  const cols = visCols, arrs = cols.map(ci => dense(ci)), dicts = cols.map(ci => dictOf(ci));
  const q = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const parts = ['﻿' + cols.map(ci => q(HEAD[ci])).join(',') + '\n'];
  let buf = '';
  for (let i = 0; i < sel.length; i++){
    const row = sel[i], line = [];
    for (let c = 0; c < cols.length; c++){ const k = arrs[c][row]; line.push(k < 0 ? '' : q(dicts[c][k])); }
    buf += line.join(',') + '\n';
    if (buf.length > 4e6){ parts.push(buf); buf = ''; }
  }
  parts.push(buf);
  const url = URL.createObjectURL(new Blob(parts, { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = `foxboro-tags-${sel.length}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(url), 4000);
});

let rz;
/* only the table cares about the viewport: its visible window is derived
   from the scroller's height */
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(paintRows, 180); });

/* =======================================================================
   10. BOOT
   ======================================================================= */
(async function boot(){
  try {
    if (typeof window.FOX_DATA_B64 !== 'string') throw new Error('ไม่พบไฟล์ data.js');
    if (typeof DecompressionStream === 'undefined')
      throw new Error('เบราว์เซอร์นี้ไม่รองรับ DecompressionStream — กรุณาใช้ Chrome/Edge รุ่นใหม่');
    $('#bootMsg').textContent = 'กำลังคลายข้อมูล 77,010 แถว…';
    const d = await decodePayload(window.FOX_DATA_B64);
    N = d.n; HEAD = d.h; RAW = d.c;
    HEAD.forEach((h, i) => { if (h && !IDX.has(h)) IDX.set(h, i); });
    iArea = IDX.get('AREA'); iCp = IDX.get('CP NAME'); iType = IDX.get('TYPE');
    iName = IDX.get('NAME'); iDesc = IDX.get('DESCRP');
    state.cols = defaultCols();

    const withData = HEAD.filter((h, i) => fillOf(i) > 0).length;
    $('#lede').innerHTML =
      `<b>${fmt(N)}</b> tag records · <b>${fmt(distinct(iCp).length)}</b> control processors · ` +
      `<b>${fmt(distinct(iType).length)}</b> block types · <b>${fmt(withData)}</b> parameters`;

    buildChips('area', $('#cArea'), iArea, null);
    buildChips('type', $('#cType'), iType, $('#qType'));
    buildChips('cp',   $('#cCp'),   iCp,   $('#qCp'));
    buildColPicker();

    $('#boot').classList.add('hide');
    $('#app').classList.remove('hide');
    refresh();
  } catch (err){
    $('#boot').innerHTML =
      `<p style="max-width:420px;text-align:center">โหลดข้อมูลไม่สำเร็จ<br><b>${esc(err.message)}</b><br><br>` +
      `ตรวจสอบว่ามีไฟล์ <code>data.js</code> อยู่โฟลเดอร์เดียวกับ <code>index.html</code></p>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
